# Build the web app and publish apps/web/dist to GitHub Pages on every push to main.
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Belt and braces on the sub-mm volumes. They are gitignored, so a CI checkout has
      # them absent and Vite copies nothing — but Vite mirrors public/ wholesale, so a
      # manual deploy from a working tree that HAS been built locally would otherwise
      # push a few hundred MB of .mat.bin to Pages. Drop them explicitly.
      - name: Drop sub-mm voxel volumes from the published site
        run: |
          find apps/web/dist/models -name '*.mat.bin' -size +90M -print -delete || true
          du -sh apps/web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
